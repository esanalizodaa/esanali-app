<!doctype html>
<!-- esanali-build:2.3 -->
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Esanalibot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);
--btn:var(--tg-theme-button-color,#2a8bf2);--btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f3f5)}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:6px;overflow-x:auto;padding:8px;position:sticky;top:0;background:var(--bg);z-index:2;scrollbar-width:none}
header button{flex:0 0 auto;border:0;border-radius:18px;padding:8px 12px;background:var(--card);color:var(--tx);font:inherit}
header button.on{background:var(--btn);color:var(--btx)}
section{display:none;padding:10px}section.on{display:block}
.card{background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--hint);background:var(--bg);color:var(--tx);font:inherit;margin-top:4px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.b{border:0;border-radius:10px;padding:10px;background:var(--btn);color:var(--btx);font:inherit;width:100%;margin-top:8px;cursor:pointer}
.b2{background:var(--card);color:var(--tx);border:1px solid var(--hint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .b{margin:0}
.msg{white-space:pre-wrap;margin:6px 0;padding:8px 10px;border-radius:10px;max-width:92%}
.me{background:var(--btn);color:var(--btx);margin-left:auto}.bot{background:var(--card)}
.hint{color:var(--hint);font-size:13px}.item{padding:9px;border-bottom:1px solid var(--hint);cursor:pointer}
#banner{padding:8px 10px;font-size:13px;display:none}#banner.on{display:block}
.pre{white-space:pre-wrap}#compass{width:180px;height:180px;margin:10px auto;border-radius:50%;border:3px solid var(--hint);position:relative}
#needle{position:absolute;left:50%;top:10px;width:4px;height:80px;margin-left:-2px;background:#1a9e4a;transform-origin:50% 80px;border-radius:2px}
#needle:after{content:'🕋';position:absolute;top:-24px;left:-10px}
</style></head><body>
<div id="banner"></div>
<header id="tabs"></header>

<section id="dl"><div class="card"><b data-i="dl_t"></b><p class="hint" data-i="dl_h"></p>
<input id="dlq" data-p="dl_p"><button class="b" onclick="dlInfo()" data-i="find"></button></div>
<div id="dlres"></div>
<div class="card"><b data-i="queue"></b> <button class="b b2" onclick="loadQueue()" style="width:auto;padding:4px 10px">↻</button><div id="qbox" class="hint"></div></div></section>

<section id="ai"><div id="chat"></div><textarea id="aiq" rows="2" data-p="ask"></textarea>
<div class="row"><button class="b" onclick="askAI()" data-i="send"></button><button class="b b2" onclick="newChat()">🧹</button><button class="b b2" id="vbtn" onclick="toggleVoice()">🎙</button></div>
<div class="row"><button class="b b2" onclick="webSearch()" data-i="web"></button></div><p class="hint" data-i="ai_h"></p></section>

<section id="img"><div class="card"><textarea id="iq" rows="3" data-p="img_p"></textarea>
<select id="isz"><option value="768x768">1:1</option><option value="768x1344">9:16</option><option value="1344x768">16:9</option></select>
<div class="row"><button class="b" onclick="genImg(false)" data-i="create"></button><button class="b b2" onclick="genImg(true)" data-i="to_chat"></button></div></div><div id="ires"></div></section>

<section id="tools">
<div class="card"><b>🌐 <span data-i="translate"></span></b><textarea id="trq" rows="3"></textarea>
<select id="trl"></select><button class="b" onclick="doTr()" data-i="translate"></button><div id="trres" class="pre"></div>
<div class="row"><button class="b b2" onclick="doTTS()">🔊 TTS</button><button class="b b2" id="sttbtn" onclick="toggleSTT()">🎤 STT</button></div><audio id="ttsa" controls style="width:100%;display:none;margin-top:8px"></audio></div>
<div class="card"><b>ℹ️</b><div class="grid" id="infogrid"></div><div id="ires2" class="pre" style="margin-top:8px"></div></div>
<div class="card"><b data-i="bot_tools"></b><p class="hint" data-i="bot_tools_h"></p><input id="tfilter" placeholder="🔎" oninput="renderTools()"><div class="grid" id="toolgrid" style="margin-top:8px"></div></div></section>

<section id="pray"><div class="card"><input id="pcity" data-p="city"><div class="row"><button class="b" onclick="loadPrayer()" data-i="show"></button><button class="b b2" onclick="geoPrayer()">📍</button></div></div>
<div id="pres" class="card pre" style="display:none"></div><div class="card" style="text-align:center"><div id="compass"><div id="needle"></div></div>
<button class="b b2" onclick="startCompass()" data-i="compass"></button><p class="hint" id="qhint"></p></div></section>

<section id="yt"><div class="card"><input id="ytq" data-p="yt_p"><button class="b" onclick="ytSearch()" data-i="search"></button></div>
<div class="card" id="ytacc"></div><div id="ytres"></div></section>

<section id="fun"><div class="grid" id="fungrid"></div><div id="funres" class="card pre" style="display:none"></div>
<div class="card"><b data-i="games"></b><div class="grid" id="gamegrid" style="margin-top:8px"></div></div></section>

<section id="set"><div class="card"><label data-i="lang"></label><select id="lang"></select>
<label data-i="persona"></label><select id="persona"><option>friend</option><option>teacher</option><option>pro</option><option>funny</option><option>poet</option><option>coder</option><option>doctor</option></select>
<label data-i="mode"></label><select id="text_mode"><option value="search">🔎 YouTube</option><option value="ai">🤖 AI</option></select>
<label><input type="checkbox" id="voice_reply" style="width:auto"> 🔊 <span data-i="voice_reply"></span></label><br>
<label><input type="checkbox" id="picker" style="width:auto"> 🎚 <span data-i="picker"></span></label><br>
<label><input type="checkbox" id="private" style="width:auto"> 🕶 <span data-i="private"></span></label>
<label data-i="city"></label><input id="city"><button class="b" onclick="saveSet()" data-i="save"></button></div>
<div class="card"><label>🌗</label><select id="theme" onchange="applyTheme()"><option value="tg">Telegram</option><option value="light">Light</option><option value="dark">Dark</option></select>
<input type="color" id="accent" value="#2a8bf2" onchange="applyTheme()" style="height:44px"></div><p class="hint" id="mode"></p></section>

<section id="admin"><div class="card" id="apanel">…</div>
<div class="card"><b>📦 Update</b><input type="file" id="pkg" accept=".gz,.tgz,application/gzip"><input id="pkgsha" placeholder="SHA-256 (optional)">
<button class="b" onclick="admUpdate()">⬆️ Update</button>
<div class="row"><button class="b b2" onclick="admCmd('adm_rollback')">⏪ Rollback</button><button class="b b2" onclick="admCmd('adm_restart')">🔄 Restart</button></div>
<div class="row"><button class="b b2" onclick="call({a:'admin_cmd',cmd:'open'}).then(loadAdmin)">Open</button><button class="b b2" onclick="call({a:'admin_cmd',cmd:'allowlist'}).then(loadAdmin)">Allowlist</button><button class="b b2" onclick="call({a:'admin_cmd',cmd:'force_off'}).then(loadAdmin)">Force-sub off</button></div></div></section>

let D=Object.assign({},S.en,S[L]||{});
function t(k){return D[k]||S.en[k]||k}
function applyI18n(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));renderTabs()}
async function loadLang(){D=Object.assign({},S.en,S[L]||{});applyI18n();
  if(!S[L]&&API){const c=localStorage.getItem('es_i18n_'+L);if(c){Object.assign(D,JSON.parse(c));applyI18n();return}
    const r=await call({a:'i18n',lang:L,s:S.en});if(r.s){localStorage.setItem('es_i18n_'+L,JSON.stringify(r.s));Object.assign(D,r.s);applyI18n()}}}
const TABS=[['dl','📥'],['ai','🤖'],['img','🎨'],['tools','🛠'],['pray','🕌'],['yt','▶️'],['fun','🎲'],['set','⚙️']];
let isAdmin=false,cur='dl';
function renderTabs(){const h=$('tabs');h.innerHTML='';(isAdmin?TABS.concat([['admin','👑']]):TABS).forEach(([id,e])=>{
  const b=document.createElement('button');b.textContent=e+' '+t(id);b.id='t_'+id;b.onclick=()=>show(id);if(id==cur)b.className='on';h.appendChild(b)})}
function show(id){cur=id;document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==id));
  document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',b.id=='t_'+id));
  if(id=='dl')loadQueue();if(id=='admin')loadAdmin();if(id=='yt')loadYtAcc()}
function banner(txt,color){const b=$('banner');b.textContent=txt;b.style.background=color;b.className=txt?'on':''}
function noLinks(s){return String(s||'').replace(/\b(?:https?:\/\/|www\.)\S+/gi,'').replace(/<[^>]+>/g,'')}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
async function call(d,timeout){
  if(API){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),timeout||180000);
    try{const r=await fetch(API.replace(/\/$/,'')+'/api',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','X-Init-Data':tg.initData},body:JSON.stringify(d)});
      clearTimeout(tm);if(r.status==401)return{error:'auth (open the app from the bot)'};return await r.json()}catch(e){clearTimeout(tm);return{error:'offline'}}}
  if(tg.sendData&&['dl','ai','web','img','set','rates','crypto','weather','news','game','tool'].includes(d.a)){try{tg.sendData(JSON.stringify(d));return{sent:true}}catch(e){}}
  return{error:'offline'}}
async function probe(){if(!API){banner(t('offline'),'#c0392b33');return}
  try{const r=await fetch(API.replace(/\/$/,'')+'/health',{cache:'no-store'});const j=await r.json();if(j.app!='esanali')throw 0;banner('','');$('mode').textContent=t('live')}
  catch(e){banner(t('offline'),'#c0392b33');API=null}}
// ---- download ----
async function dlInfo(){const q=$('dlq').value.trim();if(!q)return;const box=$('dlres');box.innerHTML='<div class="card">⏳</div>';
  const r=await call({a:'dl_info',q});box.innerHTML='';
  if(r.sent){box.append(el('div','card',t('sent')));return}
  if(r.items){r.items.forEach(it=>{const d=el('div','item','🎬 '+it.title+' ('+it.dur+')');d.onclick=()=>{$('dlq').value=it.id;dlInfo()};box.append(d)});return}
  if(r.error){box.append(el('div','card','⚠️ '+r.error));return}
  const c=el('div','card');c.append(el('b',null,r.title),el('div','hint',r.dur||''));const g=el('div','grid');g.style.marginTop='8px';
  (r.q||[]).forEach(x=>{const b=el('button','b','🎬 '+x.label+' · '+x.size);b.onclick=()=>go({a:'dl_go',tok:x.tok});g.append(b)});
  const m=el('button','b b2',t('mp3'));m.onclick=()=>go({a:'dl_go',vid:r.vid,kind:'a'});g.append(m);
  const a=el('button','b b2',t('best'));a.onclick=()=>go({a:'dl_go',vid:r.vid,kind:r.generic?'media':'v'});g.append(a);c.append(g);box.append(c)}
async function go(d){const r=await call(d);if(r.ok){tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success');tg.showAlert('📥 ✓');loadQueue()}else tg.showAlert('⚠️ '+(r.error||''))}
async function loadQueue(){if(!API)return;const r=await call({a:'queue'});const b=$('qbox');b.innerHTML='';
  (r.queue||[]).forEach((x,i)=>b.append(el('div',null,(i?'⏳ ':'⬇️ ')+x)));
  (r.history||[]).forEach(h=>b.append(el('div',null,(h.kind=='a'?'🎵 ':'🎬 ')+h.title)));if(!b.childNodes.length)b.textContent=t('empty')}
$('dlq').addEventListener('keyup',e=>{if(e.key=='Enter')dlInfo()});
// ---- AI ----
function addMsg(s,me){const d=el('div','msg '+(me?'me':'bot'),noLinks(s));$('chat').append(d);d.scrollIntoView()}
async function askAI(){const q=$('aiq').value.trim();if(!q)return;$('aiq').value='';addMsg(q,true);const r=await call({a:'ai',q});
  if(r.text)addMsg(r.text);else addMsg(r.sent?t('sent'):'⚠️ '+(r.error||''))}
async function webSearch(){const q=$('aiq').value.trim();if(!q)return;$('aiq').value='';addMsg('🌍 '+q,true);const r=await call({a:'web',q});
  if(r.text)addMsg(r.text+((r.sources||[]).length?'\n\n📚 '+r.sources.map(noLinks).join('\n📚 '):''));else addMsg(r.sent?t('sent'):'⚠️ '+(r.error||''))}
function newChat(){$('chat').innerHTML='';call({a:'ai_new'})}
async function recordToggle(btn,onDone){if(!API){tg.showAlert(t('offline'));return}
  if(window._rec&&_rec.state=='recording'){_rec.stop();btn.textContent='⏳';return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(st);const ch=[];window._rec=rec;
    rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{st.getTracks().forEach(x=>x.stop());const fr=new FileReader();
      fr.onload=()=>onDone(fr.result);fr.readAsDataURL(new Blob(ch,{type:rec.mimeType||'audio/webm'}))};rec.start();btn.textContent='⏹'}
  catch(e){tg.showAlert('🎙 '+e.message)}}
function toggleVoice(){const b=$('vbtn');recordToggle(b,async a=>{const r=await call({a:'voice',audio:a});if(r.you)addMsg(r.you,true);if(r.text)addMsg(r.text);
  if(r.audio)new Audio(r.audio).play().catch(()=>{});if(r.error)addMsg('⚠️ '+r.error);b.textContent='🎙'})}

async function genImg(toChat){const q=$('iq').value.trim();if(!q)return;const box=$('ires');box.innerHTML='<div class="card">⏳</div>';

  if(r.image){const im=el('img');im.src=r.image;im.style.width='100%';im.style.borderRadius='12px';box.append(im)}
  else box.append(el('div','card',r.ok||r.sent?t('sent'):(r.error=='blocked'?'🚫':'⚠️ '+(r.error||''))))}

const LANGS=[['en','English'],['tr','Türkçe'],['ru','Русский'],['tg','Тоҷикӣ'],['uz','Oʻzbek'],['fa','فارسی'],['ar','العربية'],['de','Deutsch'],['fr','Français'],['es','Español'],['zh','中文'],['ja','日本語'],['ko','한국어'],['hi','हिन्दी'],['it','Italiano'],['az','Azərbaycan'],['kk','Қазақ'],['ky','Кыргыз']];
LANGS.forEach(([c,n])=>{$('trl').append(new Option(n,c))});$('trl').value=TGL=='en'?'tr':'en';
async function doTr(){const q=$('trq').value.trim();if(!q)return;$('trres').textContent='⏳';const r=await call({a:'translate',q,lang:$('trl').value});$('trres').textContent=r.text?noLinks(r.text):'⚠️ '+(r.error||'')}
async function doTTS(){const q=($('trres').textContent.trim()&&!$('trres').textContent.startsWith('⚠')?$('trres').textContent:$('trq').value).trim();if(!q)return;
  const r=await call({a:'tts',q,lang:$('trl').value});if(r.audio){const a=$('ttsa');a.src=r.audio;a.style.display='block';a.play().catch(()=>{})}else tg.showAlert('⚠️ '+(r.error||''))}
function toggleSTT(){const b=$('sttbtn');recordToggle(b,async a=>{const r=await call({a:'stt',audio:a});$('trq').value=r.text||('⚠️ '+(r.error||''));b.textContent='🎤 STT'})}
[['rates','💱'],['crypto','🪙'],['weather','🌤'],['news','📰']].forEach(([a,e])=>{const b=el('button','b',e+' '+a);b.onclick=async()=>{$('ires2').textContent='⏳';
  const r=await call({a,q:a=='weather'?($('city').value||''):''});$('ires2').textContent=r.text?noLinks(r.text):(r.sent?t('sent'):'⚠️ '+(r.error||''))};$('infogrid').append(b)});
let ACTS=[];
async function loadActions(){if(!API)return;const r=await call({a:'actions'});ACTS=r.actions||[];renderTools();renderGames()}
function renderTools(){const f=$('tfilter').value.toLowerCase();const g=$('toolgrid');g.innerHTML='';
  ACTS.filter(x=>x.cat!='fun'&&x.label.toLowerCase().includes(f)).forEach(x=>{const b=el('button','b b2',x.label);b.onclick=()=>openAct(x.id);g.append(b)})}
function renderGames(){const g=$('gamegrid');g.innerHTML='';ACTS.filter(x=>x.cat=='fun').forEach(x=>{const b=el('button','b b2',x.label);b.onclick=()=>openAct(x.id);g.append(b)})}
async function openAct(id){const r=await call({a:'open',t:id});if(r.ok||r.sent){tg.showAlert(t('sent'));} else tg.showAlert('⚠️ '+(r.error||''))}
// ---- prayer ----
let QIBLA=null;
function showPrayer(r){const p=$('pres');p.style.display='block';if(r.error||!r.times){p.textContent='⚠️ '+(r.error||'');return}
  const N={Fajr:'🌅 Fajr',Sunrise:'☀️ Sunrise',Dhuhr:'🕛 Dhuhr',Asr:'🌤 Asr',Maghrib:'🌇 Maghrib',Isha:'🌙 Isha'};
  p.textContent='🕌 '+r.city+' · '+r.hijri+'\n'+Object.entries(r.times).map(([k,v])=>N[k]+': '+v).join('\n')+'\n🕋 Qibla: '+Math.round(r.qibla)+'°';
  QIBLA=r.qibla;$('needle').style.transform='rotate('+QIBLA+'deg)'}
async function loadPrayer(){showPrayer(await call({a:'prayer',q:$('pcity').value.trim()}))}
function geoPrayer(){navigator.geolocation.getCurrentPosition(async p=>showPrayer(await call({a:'prayer',lat:p.coords.latitude,lon:p.coords.longitude})),e=>tg.showAlert('📍 '+e.message))}
function startCompass(){const h=e=>{let hd=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.absolute||e.alpha!=null?360-e.alpha:null);
  if(hd==null||QIBLA==null)return;$('needle').style.transform='rotate('+((QIBLA-hd+360)%360)+'deg)';$('qhint').textContent='🧭 '+Math.round(hd)+'°'};
  const add=()=>{window.addEventListener('deviceorientationabsolute',h);window.addEventListener('deviceorientation',h)};
  if(typeof DeviceOrientationEvent!='undefined'&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().then(s=>s=='granted'&&add());else add();
  if(QIBLA==null)loadPrayer()}
// ---- YouTube ----
function vidList(items,box){box.innerHTML='';const c=el('div','card');(items||[]).forEach(it=>{const d=el('div','item',(it.pl?'📂 ':it.ch?'📺 ':'🎬 ')+it.title+(it.dur?' ('+it.dur+')':''));
  d.onclick=()=>{if(it.pl)ytAcc('pl',it.pl);else if(it.ch)ytAcc('ch',it.ch);else{$('dlq').value=it.id;show('dl');dlInfo()}};c.append(d)});if(!(items||[]).length)c.textContent=t('empty');box.append(c)}
async function ytSearch(){const q=$('ytq').value.trim();if(!q)return;$('ytres').innerHTML='<div class="card">⏳</div>';const r=await call({a:'yt',q});vidList(r.items,$('ytres'))}
$('ytq').addEventListener('keyup',e=>{if(e.key=='Enter')ytSearch()});
async function loadYtAcc(){if(!API)return;const b=$('ytacc');const r=await call({a:'yt_acc',w:'status'});b.innerHTML='';
  if(r.error=='oauth_not_configured'){b.append(el('div','hint',t('nooauth')));return}
  if(!r.login){const x=el('button','b',t('login'));x.onclick=()=>openAct('yt_login');b.append(x);return}
  const g=el('div','grid');[['liked','liked'],['subs','subs'],['pls','pls']].forEach(([w,k])=>{const x=el('button','b b2',t(k));x.onclick=()=>ytAcc(w);g.append(x)});b.append(g)}
async function ytAcc(w,id){$('ytres').innerHTML='<div class="card">⏳</div>';const r=await call({a:'yt_acc',w,id});if(r.login===false){loadYtAcc();$('ytres').innerHTML='';return}vidList(r.items,$('ytres'))}
// ---- fun ----
[['joke','😂'],['fact','💡'],['quote','💬'],['riddle','🧩'],['compliment','🌸'],['dice','🎲'],['coin','🪙'],['num','🔢']].forEach(([k,e])=>{const b=el('button','b',e+' '+k);
  b.onclick=async()=>{const p=$('funres');p.style.display='block';p.textContent='⏳';const r=await call({a:'fun',k});p.textContent=r.text?noLinks(r.text):'⚠️ '+(r.error||'')};$('fungrid').append(b)});
// ---- settings ----
$('lang').append(new Option('🌐 '+t('auto')+' ('+TGL+')',''));LANGS.forEach(([c,n])=>$('lang').append(new Option(n,c)));
async function loadSet(){if(!API)return;const r=await call({a:'get'});const s=r.settings||{};
  for(const k of ['persona','text_mode','city'])if(s[k]!=null)$(k).value=s[k];$('lang').value=s.lang||'';
  for(const k of ['voice_reply','picker'])$(k).checked=!!s[k];$('private').checked=!!s.private;if(s.city&&!$('pcity').value)$('pcity').value=s.city;
  const nl=s.lang||TGL;if(nl!=L){L=nl;loadLang()}}
async function saveSet(){const sets=[['lang',$('lang').value||null],['persona',$('persona').value],['text_mode',$('text_mode').value],['voice_reply',$('voice_reply').checked],
  ['picker',$('picker').checked],['private',$('private').checked?10:0],['city',$('city').value]];
  L=$('lang').value||TGL;localStorage.setItem('es_lang',L);loadLang();
  if(API){for(const [k,v] of sets)await call({a:'set',k,v});tg.showAlert(t('saved'))}else tg.sendData(JSON.stringify({a:'set',k:'bulk',v:sets}))}
function applyTheme(){const th=$('theme').value,a=$('accent').value,r=document.documentElement.style;localStorage.setItem('es_theme',th);localStorage.setItem('es_accent',a);
  const P={light:['#ffffff','#111111','#f2f3f5','#888888'],dark:['#17212b','#f5f5f5','#232e3c','#8a99a8']}[th];
  ['--bg','--tx','--card','--hint'].forEach((k,i)=>P?r.setProperty(k,P[i]):r.removeProperty(k));r.setProperty('--btn',a)}
(function(){const th=localStorage.getItem('es_theme'),a=localStorage.getItem('es_accent');if(th)$('theme').value=th;if(a)$('accent').value=a;if(th||a)applyTheme()})();

function admUpdate(){const f=$('pkg').files[0];if(!f)return;const fr=new FileReader();fr.onload=async()=>{tg.showAlert('⬆️ …');

(async()=>{applyI18n();show('dl');await probe();await loadLang();
